name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-vps:
    name: Deploy to production VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - name: Prepare SSH configuration
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not configured" >&2; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "VPS_KNOWN_HOSTS is not configured" >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/mediagateway-ssh"
          mkdir -m 700 -p "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Update VPS and verify services
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is not configured" >&2; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is not configured" >&2; exit 1; }
          test -n "$VPS_APP_DIR" || { echo "VPS_APP_DIR is not configured" >&2; exit 1; }
          case "$VPS_PORT" in
            ''|*[!0-9]*) VPS_PORT=22 ;;
          esac
          ssh \
            -i "$SSH_DIR/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_APP_DIR" <<'REMOTE'
          set -Eeuo pipefail
          app_dir="$1"
          test -d "$app_dir"
          cd "$app_dir"
          test -f docker-compose.yml
          test -f backend/.env
          test "$(git branch --show-current)" = "main"
          git fetch --prune origin main
          git merge --ff-only origin/main
          docker compose config >/dev/null
          docker compose pull
          docker compose up -d --remove-orphans
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3002/health >/dev/null \
              && curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
          REMOTE

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
